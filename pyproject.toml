[project]
name = "telegram-ai-support-bot"
version = "0.1.0"
description = "Telegram AI customer-support bot with private manager panel"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.4,<4.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.2,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
